<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance — DentCare</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;min-height:100vh;background:#0f1f3d;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:40px}
    .icon{font-size:64px;margin-bottom:24px;opacity:.7}
    h1{font-family:'DM Serif Display',serif;font-size:36px;margin-bottom:12px}
    p{color:rgba(255,255,255,.6);font-size:15px;max-width:420px;line-height:1.7;margin:0 auto}
    .badge{display:inline-block;margin-top:24px;padding:6px 16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:20px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  </style>
</head>
<body>
  <div>
    <div class="icon">🔧</div>
    <h1>Under Maintenance</h1>
    <p>DentCare is currently undergoing scheduled maintenance. We'll be back up shortly. Thank you for your patience.</p>
    <div class="badge">HTTP 503 — Service Temporarily Unavailable</div>
  </div>
</body>
</html>
