{% extends 'base.html' %}
{% block title %}Delete Payslip — DentCare{% endblock %}
{% block page_title %}Delete Payslip{% endblock %}

{% block content %}
<div class="card p-4" style="max-width: 500px;">
    <div class="text-center mb-4">
        <div style="font-size: 3rem;" class="text-danger">
            <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h5 class="fw-bold mt-2">Delete this payslip?</h5>
        <p class="text-muted">
            {{ payslip.employee.user.get_full_name }} —
            {{ payslip.month }} {{ payslip.year }}
        </p>
    </div>
    <form method="POST" class="d-flex gap-2 justify-content-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">
            <i class="bi bi-trash me-1"></i> Yes, Delete
        </button>
        <a href="{% url 'billing:payslip_list' %}" class="btn btn-outline-secondary px-4">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
